# Builds pngfit on Linux, macOS, Windows and as WebAssembly and runs the self-test on each;
# checks the formatting of every language and runs the self-test and a fuzzer under sanitizers.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libdeflate-dev zlib1g-dev python3-numpy python3-pil
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Self-test
        run: make check

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Dependencies
        run: |
          brew install libdeflate
          python3 -m pip install numpy pillow
      - name: Build
        run: make CPPFLAGS="-I$(brew --prefix)/include" LDFLAGS="-flto=auto -L$(brew --prefix)/lib"
      - name: Self-test
        run: make check

  windows:
    name: Windows (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep line endings as committed
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libdeflate
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python-numpy
            mingw-w64-x86_64-python-pillow
      - name: Build
        run: make windows
      - name: Self-test
        env:
          PYTHONUTF8: '1'
        run: python tools/selftest.py ./pngfit.exe
      - uses: actions/upload-artifact@v7
        with:
          name: pngfit-windows-x86_64
          path: pngfit.exe

  web:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.11
      - name: Build the page
        run: web/build.sh
      - name: Same bytes as the native build
        run: web/dev/node_check.sh docs/img/*.png

  lint:
    name: Formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: C (clang-format, the version the code was formatted with)
        run: pipx run clang-format==22.1.8 --dry-run --Werror pngfit.c tools/fuzz.c
      - name: Python (ruff)
        run: |
          pipx run ruff==0.17.0 format --check .
          pipx run ruff==0.17.0 check .
      - name: JavaScript and HTML (prettier)
        run: npx --yes prettier@3.9.10 --check .
      - name: Shell (shellcheck)
        run: shellcheck web/build.sh web/dev/*.sh tools/fuzz.sh

  sanitizers:
    name: Sanitizers and fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-pil
      - name: Self-test under AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          clang -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -std=gnu11 -Ivendor/libdeflate -Ivendor/zlib -o pngfit-asan pngfit.c vendor/libdeflate/lib/*.c \
            vendor/libdeflate/lib/x86/cpu_features.c vendor/libdeflate/lib/arm/cpu_features.c \
            vendor/zlib/{adler32,crc32,inflate,inffast,inftrees,uncompr,zutil}.c -lpthread -lm
          python3 tools/selftest.py ./pngfit-asan
      - name: Fuzz the PNG reader for a minute
        run: tools/fuzz.sh 60
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crash
          path: fuzz/crash-*
